# ──────────────────────────────────────────────────────────────────────────────
# Альтернатива Caddyfile — nginx для Windows (https://nginx.org/en/download.html).
# Положите этот файл как conf/nginx.conf рядом с nginx.exe (или include из него).
# Запуск из папки nginx:  start nginx      перезагрузка:  nginx -s reload
# ──────────────────────────────────────────────────────────────────────────────
worker_processes  1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript image/svg+xml;

    upstream gallery_api {
        server 127.0.0.1:5000;
    }

    server {
        listen 80;
        server_name _;                 # ← при появлении домена: gallery.example.com
        client_max_body_size 20m;

        # ← путь к собранному фронту (npm run build в frontend/)
        root  C:/gallery/ArtGallary/frontend/dist;
        index index.html;

        # /api/<x> → http://127.0.0.1:5000/<x>  (префикс снимается благодаря "/" в конце)
        location ^~ /api/ {
            proxy_pass         http://gallery_api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # SPA: любой неизвестный путь → index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}

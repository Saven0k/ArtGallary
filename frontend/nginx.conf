# Конфиг nginx ВНУТРИ docker-контейнера фронта (см. deploy/docker-compose.yml).
# Для деплоя на Windows-ПК без Docker используйте deploy/Caddyfile или deploy/nginx.conf.
server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # /api/<x> → http://server:5000/<x>  (префикс снимается)
    location ^~ /api/ {
        proxy_pass         http://server:5000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA: любой неизвестный путь → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

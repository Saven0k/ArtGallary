services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      POSTGRES_USER: gallery
      POSTGRES_DB: gallery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U gallery -d gallery]
      interval: 5s
      timeout: 3s
      start_period: 120s
      retries: 120
    logging:
      driver: journald
      options:
        tag: artgallary-db

  server:
    build:
      context: .
      dockerfile: server/Dockerfile.coolify
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HTTP_HOST: 0.0.0.0
      PORT: "5000"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: gallery
      POSTGRES_DB: gallery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-romasav2017@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      ADMIN_NAME: savenok
      DB_SYNC: "false"
      STATIC_DIR: /data/uploads
      BASE_URL: /api
      TRUST_PROXY: "true"
      FRONTEND_URL: ${FRONTEND_URL:-http://192.168.1.97:3101}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://192.168.1.97:3101}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SWAGGER_ENABLED: "false"
      TRANSLATION_ENABLED: "false"
      TELEGRAM_BOT_ENABLED: "false"
    ports:
      - "3102:5000"
    volumes:
      - uploads:/data/uploads
      - server-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12
    logging:
      driver: journald
      options:
        tag: artgallary-api

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3101:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1/api/health]
      interval: 15s
      timeout: 5s
      retries: 6
    logging:
      driver: journald
      options:
        tag: artgallary-web

volumes:
  pgdata:
  uploads:
  server-logs: